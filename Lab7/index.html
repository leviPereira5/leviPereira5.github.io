<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 Loja Virtual</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>🛒 Loja Virtual</h1>
    <nav>
      <ul>
        <li><a href="#produtos">Produtos</a></li>
        <li><a href="#cesto">Cesto</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- 🔎 Área de filtros -->
    <section id="filtros">
      <p>Pesquisar:
        <input type="text" id="pesquisa" placeholder="Digite o nome do produto">
      </p>

      <p>Filtrar por categoria:
        <select id="categorias"></select>
      </p>

      <p>Ordenar por preço:
        <select id="ordenar">
          <option value="">Sem ordenação</option>
          <option value="asc">Menor preço → Maior preço</option>
          <option value="desc">Maior preço → Menor preço</option>
        </select>
      </p>
    </section>

    
    <!-- 🧾 Seção de produtos -->
    <section id="produtos">
      <h2>Produtos disponíveis</h2>
      <!-- Produtos inseridos dinamicamente pelo JS -->
    </section>

    <!-- 🛍️ Seção do cesto -->
    <section id="cesto">
      <h2>Meu Cesto</h2>

      <section id="produtos-selecionados"></section>

      <p id="total">💵 Total: R$ 0,00</p>
    </section>

    <section id="checkout">
  <p>
    És estudante do DEISI?
    <input type="checkbox" id="estudante">
  </p>

  <p>
    Cupão de desconto:
    <input type="text" id="cupao">
  </p>

  <button id="comprar">Comprar</button>

  <p id="resposta-compra"></p>
</section>

  </main>

  <footer>
    <p>© 2025 Loja Virtual — Todos os direitos reservados</p>
  </footer>

  <!-- Scripts -->
  <script src="main.js"></script>
</body>

</html>
