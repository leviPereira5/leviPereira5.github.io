<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Loja</title>
  </head>

  <body>
    <header>
      <h1><img src="images/deisi-inverse.svg" alt="" class="logo" /> Loja</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produto</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <p>Filtrar</p>
        <select name="filtrar" id="filtrar">
          <option value="">Todas as categorias</option>
        </select>
      </section>

      <section>
        <p>Ordenar</p>
        <select name="ordenar" id="ordenar">
          <option value="">Ordenar pelo preço</option>
          <option value="crescente">Preço Crescente</option>
          <option value="decrescente">Preço Decrescente</option>
        </select>
      </section>

      <section>
        <p>Pesquisa</p>
        <input type="text" id="procurar" placeholder="pesquise por produto" />
      </section>

      <section id="produtos">
        <h2>Produtos</h2>
      </section>

      <div class="coluna-direita">
        <section id="cesto">
          <h2>Cesto</h2>
        </section>

        <section id="checkout-section">
          <h2>Finalizar Compra</h2>
          <div id="checkout-form">
            <div class="form-group">
              <label for="nome">Nome:</label>
              <input type="text" id="nome" placeholder="O teu nome" />
            </div>

            <div class="form-group checkbox-group">
              <label>
                <input type="checkbox" id="estudante" /> És estudante do DEISI?
              </label>
            </div>

            <div class="form-group">
              <label for="cupao">Cupão de desconto:</label>
              <input type="text" id="cupao" placeholder="Insira o cupão" />
            </div>

            <button id="btn-comprar">Comprar</button>
          </div>

          <div id="resultado-compra"></div>
        </section>
      </div>
    </main>

    <footer>Diw 2026</footer>

    <script src="script.js"></script>
  </body>
</html>
