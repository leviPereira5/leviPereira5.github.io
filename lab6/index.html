<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cromos</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Coleção de Cromos</h1>
    </header>
    <main>
      <section class="colecao">
        <h2>A minha coleção</h2>
        <ul></ul>
        <h3>Total de cromos: <span>0</span></h3>
      </section>

      <section class="repetidos">
        <h2>Cromos Repetidos</h2>
        <ul></ul>
        <h3>Total de repetidos: <span>0</span></h3>
      </section>

      <section class="registar">
        <h2>Registar novo cromo</h2>
        <form>
          <input
            type="number"
            placeholder="numero"
            class="input_numero"
            required
          />
          <input
            type="submit"
            value="Registar Cromo"
            class="input_submit"
            autofocus
          />
        </form>
      </section>
    </main>
    <footer>2026, ULusófona</footer>

    <script src="script.js"></script>
  </body>
</html>
